<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07110E"/>
      <stop offset=".55" stop-color="#101D19"/>
      <stop offset="1" stop-color="#020706"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#10B981" stop-opacity=".5"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#253D35"/>
      <stop offset="1" stop-color="#07100D"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#102B24"/>
      <stop offset="1" stop-color="#050B0A"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <ellipse cx="1190" cy="430" rx="440" ry="370" fill="url(#glow)" filter="url(#blur)"/>

  <g opacity=".2" stroke="#34D399">
    <path d="M800 100H1600M800 200H1600M800 300H1600M800 400H1600M800 500H1600M800 600H1600"/>
    <path d="M900 0V700M1050 0V700M1200 0V700M1350 0V700M1500 0V700"/>
  </g>

  <!-- Digital globe -->
  <circle cx="1260" cy="310" r="210" fill="#0A241D" stroke="#10B981" stroke-opacity=".8" stroke-width="2"/>
  <circle cx="1260" cy="310" r="165" stroke="#34D399" stroke-opacity=".45"/>
  <ellipse cx="1260" cy="310" rx="95" ry="210" stroke="#34D399" stroke-opacity=".4"/>
  <ellipse cx="1260" cy="310" rx="210" ry="75" stroke="#34D399" stroke-opacity=".4"/>
  <ellipse cx="1260" cy="310" rx="210" ry="145" stroke="#34D399" stroke-opacity=".25"/>
  <path d="M1050 310H1470M1260 100V520" stroke="#34D399" stroke-opacity=".25"/>
  <circle cx="1260" cy="310" r="8" fill="#34D399"/>

  <!-- Floating interface panel -->
  <rect x="900" y="390" width="280" height="230" rx="18" fill="#07110F" stroke="#10B981" stroke-opacity=".7"/>
  <rect x="925" y="415" width="230" height="15" rx="7" fill="#1C4034"/>
  <g fill="#34D399" opacity=".85">
    <rect x="925" y="465" width="110" height="7" rx="3"/>
    <rect x="925" y="490" width="190" height="7" rx="3"/>
    <rect x="925" y="515" width="155" height="7" rx="3"/>
    <rect x="925" y="540" width="205" height="7" rx="3"/>
    <rect x="925" y="565" width="125" height="7" rx="3"/>
  </g>

  <!-- Desk -->
  <path d="M620 750H1600V1000H620Z" fill="#050B09"/>
  <path d="M620 750H1600" stroke="#10B981" stroke-opacity=".6" stroke-width="3"/>
  <ellipse cx="1190" cy="790" rx="430" ry="55" fill="#10B981" opacity=".12" filter="url(#blur)"/>

  <!-- Laptop -->
  <path d="M900 520Q900 500 925 500H1390Q1410 500 1410 520V790H900V520Z" fill="#05090C" stroke="#64756E" stroke-width="5"/>
  <rect x="925" y="525" width="460" height="235" rx="7" fill="url(#screen)"/>
  <g opacity=".9">
    <rect x="950" y="555" width="190" height="8" rx="4" fill="#10B981"/>
    <rect x="950" y="580" width="320" height="6" rx="3" fill="#6EE7B7"/>
    <rect x="970" y="605" width="250" height="6" rx="3" fill="#60A5FA"/>
    <rect x="970" y="630" width="300" height="6" rx="3" fill="#A78BFA"/>
    <rect x="950" y="655" width="200" height="6" rx="3" fill="#6EE7B7"/>
    <rect x="970" y="680" width="270" height="6" rx="3" fill="#60A5FA"/>
    <rect x="970" y="705" width="220" height="6" rx="3" fill="#A78BFA"/>
    <rect x="950" y="730" width="180" height="6" rx="3" fill="#10B981"/>
  </g>
  <path d="M900 790H1410L1490 835H820L900 790Z" fill="url(#glass)" stroke="#64756E" stroke-width="3"/>
  <path d="M1050 803H1260" stroke="#34D399" stroke-opacity=".5" stroke-width="4"/>

  <!-- Ambient light -->
  <path d="M0 900H1600" stroke="#10B981" stroke-opacity=".3"/>
  <circle cx="1150" cy="800" r="5" fill="#34D399"/>
  <circle cx="1450" cy="700" r="4" fill="#34D399"/>
  <circle cx="800" cy="300" r="4" fill="#34D399"/>
</svg>